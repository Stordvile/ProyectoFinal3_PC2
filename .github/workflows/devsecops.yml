name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==========================================================================
  # ETAPA 1: SEGURIDAD SHIFT-LEFT Y CALIDAD (3 BLOQUES EN PARALELO)
  # ==========================================================================
  secret-scan:
    name: "1. Escaneo de Secretos (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks sobre código e historial Git
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source="/repo" --verbose --redact

  dependency-audit:
    name: "2. Auditoría de Dependencias (SCA)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Auditar vulnerabilidades (npm audit)
        run: npm audit --audit-level=high

  lint-and-sast:
    name: "3. Análisis Estático (ESLint + Semgrep SAST)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar ESLint con reglas de seguridad
        run: npm run lint

      - name: Ejecutar análisis SAST con Semgrep (JS/React/OWASP)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep \
            semgrep scan \
            --config p/javascript \
            --config p/react \
            --config p/owasp-top-ten \
            --exclude node_modules \
            --exclude dist \
            --exclude tests \
            --error /src

  # ==========================================================================
  # ETAPA 2: PRUEBAS AUTOMATIZADAS (2 BLOQUES EN PARALELO)
  # ==========================================================================
  unit-tests:
    name: "4. Pruebas Unitarias (Vitest)"
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, lint-and-sast]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar pruebas unitarias de dominio y seguridad
        run: npm run test:unit

  integration-tests:
    name: "5. Pruebas de Integración (API + UI)"
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, lint-and-sast]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar pruebas de integración de Serverless API y React UI
        run: npm run test:integration

  # ==========================================================================
  # ETAPA 3: COMPILACIÓN Y EMPAQUETADO
  # ==========================================================================
  build:
    name: "6. Build de Producción (Vite)"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Compilar aplicación frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Publicar artefacto compilado (dist)
        uses: actions/upload-artifact@v4
        with:
          name: limpiaseguro-dist
          path: dist/
          retention-days: 7

  # ==========================================================================
  # ETAPA 4: DESPLIEGUE CONTINUO EN VERCEL (PREVIEW EN test / PROD EN main)
  # ==========================================================================
  deploy-preview:
    name: "7. Deploy Preview en Vercel (test)"
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar entorno Preview en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npm install --global vercel@latest
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            vercel build --token="$VERCEL_TOKEN"
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
            echo "Preview desplegado en: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Despliegue Preview delegado a la integración Git nativa de Vercel (agrega VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID para desplegar vía CLI)." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-production:
    name: "7. Deploy Producción en Vercel (main)"
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar entorno Producción en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npm install --global vercel@latest
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
            echo "Producción desplegada en: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Despliegue Producción delegado a la integración Git nativa de Vercel (agrega VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID para desplegar vía CLI)." >> "$GITHUB_STEP_SUMMARY"
          fi
